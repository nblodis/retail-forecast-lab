[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecast-lab"
version = "0.1.0"
description = "A reproducible retail demand forecasting demonstration with synthetic data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3"]
keywords = ["retail", "demand-forecasting", "time-series", "inventory", "backtesting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
viz = ["matplotlib>=3.7"]

[project.scripts]
retail-forecast = "retail_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
